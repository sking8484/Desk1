version: "2.1"
services:
  database:
    image: mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=my-secret-pw
      - MYSQL_DATABASE=test
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:3306"]
        interval: 10s
        timeout: 5s
        retries: 5
  service:
    build: 
      context: .
      dockerfile: deployment/analysis/Dockerfile
      args:
        function: analysis
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "9000:8080"
volumes:
  mysql:
